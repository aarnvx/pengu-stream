<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#051e30">
    <link rel="icon" type="image/png" href="Emoji/icon.png">
    <link rel="apple-touch-icon" href="Emoji/icon.png">
    <title>PenguStream - Détails du contenu</title>
    <link rel="stylesheet" href="window-pages.css">
    <script src="window-pages.js" defer></script>
    <script>
        (function () {
            function setTheme(theme) {
                if (theme === 'octobre_rose' || theme === 'novembre_bleu') document.documentElement.dataset.theme = theme;
                else delete document.documentElement.dataset.theme;
            }
            window.addEventListener('message', function (event) {
                var frame = document.querySelector('iframe');
                if (frame && event.source === frame.contentWindow && event.data && event.data.type === 'pengu-theme-change') setTheme(event.data.theme);
            });
        })();
    </script>
</head>
<body>
    <iframe id="app" title="Détails du film ou de la série" allow="fullscreen; autoplay"></iframe>
    <noscript><p><a href="V100.html#films">Ouvrir le catalogue</a></p></noscript>
    <script>
        var params = new URLSearchParams(window.location.search);
        var type = params.get('type') === 'serie' ? 'serie' : 'film';
        var id = params.get('id') || '';
        document.getElementById('app').src = id
            ? 'V100.html#' + type + '/' + encodeURIComponent(id)
            : 'V100.html#films';
    </script>
</body>
</html>
