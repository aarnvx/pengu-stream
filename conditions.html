<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#051e30">
    <link rel="icon" type="image/png" href="Emoji/icon.png">
    <link rel="apple-touch-icon" href="Emoji/icon.png">
    <title>PenguStream — Conditions d’utilisation</title>
    <link rel="stylesheet" href="window-pages.css">
    <script src="window-pages.js" defer></script>
    <script>
        (function () {
            function setTheme(theme) {
                if (theme === 'octobre_rose' || theme === 'novembre_bleu') document.documentElement.dataset.theme = theme;
                else delete document.documentElement.dataset.theme;
            }
            try { setTheme(localStorage.getItem('pengu_active_theme')); } catch (error) {}
            window.addEventListener('message', function (event) {
                var frame = document.querySelector('iframe');
                if (frame && event.source === frame.contentWindow && event.data && event.data.type === 'pengu-theme-change') setTheme(event.data.theme);
            });
        })();
    </script>
</head>
<body>
    <iframe src="V100.html#conditions" title="Conditions d’utilisation PenguStream" allow="fullscreen; autoplay"></iframe>
    <noscript><p><a href="V100.html#conditions">Lire les conditions d’utilisation</a></p></noscript>
</body>
</html>
