<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#051e30">
    <meta name="description" content="Regardez des films, séries et animés en streaming sur PenguStream. Découvrez un catalogue glacial, vos favoris et les nouveautés.">
    <meta property="og:title" content="PenguStream - Le streaming glacial">
    <meta property="og:description" content="Films, séries et animés en streaming sur PenguStream.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pengustream.com/">
    <link rel="icon" type="image/png" href="Emoji/icon.png">
    <link rel="apple-touch-icon" href="Emoji/icon.png">
    <link rel="canonical" href="https://pengustream.com/">
    <title>PenguStream - Accueil</title>
    <style>
        :root {
            --window-background: #051e30;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--window-background);
        }

        html[data-theme="octobre_rose"] {
            --window-background: #250d1d;
        }

        html[data-theme="novembre_bleu"] {
            --window-background: #0b2540;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: 0;
            background: var(--window-background);
        }

        main {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #app-loading {
            --loading-glow: rgba(23, 165, 137, .2);
            --loading-glow-secondary: rgba(67, 230, 181, .1);
            --loading-start: #0a3d62;
            --loading-end: #051522;
            --loading-accent: #43e6b5;
            --loading-accent-alt: #b8e0f7;
            --loading-card: rgba(5, 30, 48, .42);
            --loading-border: rgba(184, 224, 247, .16);
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 28px;
            overflow: hidden;
            color: #f2f9ff;
            background:
                radial-gradient(ellipse at 50% 35%, var(--loading-glow), transparent 38%),
                radial-gradient(ellipse at 15% 85%, var(--loading-glow-secondary), transparent 42%),
                linear-gradient(145deg, var(--loading-start), var(--loading-end) 72%);
            font-family: system-ui, sans-serif;
            text-align: center;
            transition: opacity .45s ease, visibility .45s ease;
        }

        html[data-theme="hiver"] #app-loading {
            --loading-glow: rgba(74, 144, 217, .25);
            --loading-glow-secondary: rgba(137, 207, 240, .12);
            --loading-start: #071428;
            --loading-end: #040d1a;
            --loading-accent: #89cff0;
            --loading-accent-alt: #4a90d9;
            --loading-card: rgba(4, 13, 26, .48);
            --loading-border: rgba(137, 207, 240, .2);
        }

        html[data-theme="noel"] #app-loading {
            --loading-glow: rgba(231, 76, 60, .2);
            --loading-glow-secondary: rgba(39, 174, 96, .14);
            --loading-start: #0d2b0d;
            --loading-end: #0a0f0a;
            --loading-accent: #e74c3c;
            --loading-accent-alt: #27ae60;
            --loading-card: rgba(10, 15, 10, .48);
            --loading-border: rgba(231, 76, 60, .2);
        }

        html[data-theme="halloween"] #app-loading {
            --loading-glow: rgba(255, 140, 0, .22);
            --loading-glow-secondary: rgba(106, 13, 173, .18);
            --loading-start: #1a0700;
            --loading-end: #0d0300;
            --loading-accent: #ff8c00;
            --loading-accent-alt: #a855f7;
            --loading-card: rgba(13, 3, 0, .5);
            --loading-border: rgba(255, 140, 0, .2);
        }

        html[data-theme="paques"] #app-loading {
            --loading-glow: rgba(168, 224, 99, .2);
            --loading-glow-secondary: rgba(255, 107, 157, .16);
            --loading-start: #0f2b10;
            --loading-end: #0a1a0a;
            --loading-accent: #a8e063;
            --loading-accent-alt: #ff6b9d;
            --loading-card: rgba(10, 26, 10, .48);
            --loading-border: rgba(168, 224, 99, .2);
        }

        html[data-theme="valentin"] #app-loading {
            --loading-glow: rgba(233, 30, 99, .22);
            --loading-glow-secondary: rgba(255, 128, 171, .14);
            --loading-start: #1f0510;
            --loading-end: #100208;
            --loading-accent: #ff4081;
            --loading-accent-alt: #ff80ab;
            --loading-card: rgba(16, 2, 8, .5);
            --loading-border: rgba(255, 64, 129, .22);
        }

        html[data-theme="octobre_rose"] #app-loading {
            --loading-glow: rgba(236, 72, 153, .22);
            --loading-glow-secondary: rgba(219, 39, 119, .16);
            --loading-start: #341329;
            --loading-end: #190713;
            --loading-accent: #ec4899;
            --loading-accent-alt: #f9a8d4;
            --loading-card: rgba(25, 7, 19, .5);
            --loading-border: rgba(249, 168, 212, .2);
        }

        html[data-theme="novembre_bleu"] #app-loading {
            --loading-glow: rgba(14, 165, 233, .24);
            --loading-glow-secondary: rgba(37, 99, 235, .16);
            --loading-start: #0c2444;
            --loading-end: #061326;
            --loading-accent: #0ea5e9;
            --loading-accent-alt: #7dd3fc;
            --loading-card: rgba(6, 19, 38, .5);
            --loading-border: rgba(125, 211, 252, .2);
        }

        html[data-theme="printemps"] #app-loading {
            --loading-glow: rgba(149, 213, 178, .2);
            --loading-glow-secondary: rgba(255, 133, 161, .16);
            --loading-start: #0a1f0a;
            --loading-end: #050f05;
            --loading-accent: #95d5b2;
            --loading-accent-alt: #ff85a1;
            --loading-card: rgba(5, 15, 5, .5);
            --loading-border: rgba(149, 213, 178, .2);
        }

        html[data-theme="ete"] #app-loading {
            --loading-glow: rgba(72, 202, 228, .2);
            --loading-glow-secondary: rgba(247, 127, 0, .15);
            --loading-start: #0a1428;
            --loading-end: #050a1a;
            --loading-accent: #48cae4;
            --loading-accent-alt: #f77f00;
            --loading-card: rgba(5, 10, 26, .5);
            --loading-border: rgba(72, 202, 228, .2);
        }

        html[data-theme="feu_artifice"] #app-loading {
            --loading-glow: rgba(231, 76, 60, .2);
            --loading-glow-secondary: rgba(52, 152, 219, .18);
            --loading-start: #0a0028;
            --loading-end: #05001a;
            --loading-accent: #f1c40f;
            --loading-accent-alt: #3498db;
            --loading-card: rgba(5, 0, 26, .5);
            --loading-border: rgba(241, 196, 15, .2);
        }

        html[data-theme="automne"] #app-loading {
            --loading-glow: rgba(230, 126, 34, .22);
            --loading-glow-secondary: rgba(192, 57, 43, .16);
            --loading-start: #1a0a00;
            --loading-end: #0f0500;
            --loading-accent: #f39c12;
            --loading-accent-alt: #c0392b;
            --loading-card: rgba(15, 5, 0, .5);
            --loading-border: rgba(243, 156, 18, .2);
        }

        #app-loading[hidden] {
            display: flex;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #app-loading .loading-card {
            width: min(100%, 350px);
            padding: 32px 28px 28px;
            border: 1px solid var(--loading-border);
            border-radius: 28px;
            background: var(--loading-card);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .07);
            backdrop-filter: blur(14px);
        }

        #app-loading .loading-mascot {
            display: block;
            width: 104px;
            height: 104px;
            margin: 0 auto 18px;
            object-fit: contain;
            filter: drop-shadow(0 12px 24px var(--loading-glow));
            animation: pengu-loading-float 2.8s ease-in-out infinite;
        }

        #app-loading .loading-title {
            margin: 0;
            font-size: clamp(1.35rem, 5vw, 1.7rem);
            font-weight: 800;
            letter-spacing: .01em;
        }

        #app-loading .loading-caption {
            margin: 8px 0 22px;
            color: rgba(232, 244, 253, .72);
            font-size: .94rem;
        }

        #app-loading .loading-track {
            height: 5px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(184, 224, 247, .14);
        }

        #app-loading .loading-track::after {
            display: block;
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--loading-accent), var(--loading-accent-alt));
            content: "";
            animation: pengu-loading-progress 1.5s ease-in-out infinite;
        }

        @keyframes pengu-loading-float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-9px) rotate(2deg); }
        }

        @keyframes pengu-loading-progress {
            from { transform: translateX(-110%); }
            to { transform: translateX(250%); }
        }

        @media (prefers-reduced-motion: reduce) {
            #app-loading,
            #app-loading *,
            #app-loading *::before,
            #app-loading *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
    <script>
        (function () {
            var themes = ['hiver', 'noel', 'halloween', 'paques', 'valentin', 'octobre_rose', 'novembre_bleu', 'printemps', 'ete', 'feu_artifice', 'automne'];
            function setTheme(theme) {
                if (themes.indexOf(theme) !== -1) document.documentElement.dataset.theme = theme;
                else delete document.documentElement.dataset.theme;
            }
            window.addEventListener('message', function (event) {
                var frame = document.querySelector('iframe');
                if (frame && event.source === frame.contentWindow && event.data && event.data.type === 'pengu-theme-change') setTheme(event.data.theme);
            });
        })();
    </script>
</head>
<body>
    <main>
        <div id="app-loading" role="status" aria-live="polite">
            <div class="loading-card">
                <img class="loading-mascot" src="Emoji/icon.png" alt="">
                <p class="loading-title">Prépare ton pop-corn</p>
                <p class="loading-caption">PenguStream se prépare…</p>
                <div class="loading-track" aria-hidden="true"></div>
            </div>
        </div>
        <script>
            (function () {
                var main = document.querySelector('main');
                var loading = document.getElementById('app-loading');
                var callbackKeys = ['code', 'error', 'error_code', 'error_description', 'error_uri', 'state'];
                var callbackParams = new URLSearchParams();
                var cleanParams = new URLSearchParams(window.location.search);
                var hasAuthCallback = false;

                callbackKeys.forEach(function (key) {
                    if (!cleanParams.has(key)) return;
                    callbackParams.set(key, cleanParams.get(key));
                    cleanParams.delete(key);
                    if (key === 'code' || key === 'error') hasAuthCallback = true;
                });

                var appUrl = new URL('V100.html', window.location.href);
                appUrl.hash = 'accueil';
                if (hasAuthCallback) {
                    appUrl.search = callbackParams.toString();
                    var remainingQuery = cleanParams.toString();
                    window.history.replaceState(window.history.state, '', window.location.pathname
                        + (remainingQuery ? '?' + remainingQuery : '') + window.location.hash);
                }

                var frame = document.createElement('iframe');
                frame.title = 'PenguStream - Accueil';
                frame.allow = 'fullscreen; autoplay';
                frame.addEventListener('load', function () {
                    if (frame.contentWindow.location.href !== 'about:blank') loading.hidden = true;
                });
                frame.src = appUrl.href;
                main.insertBefore(frame, loading.nextSibling);
            })();
        </script>
        <noscript><p><a href="V100.html#accueil">Ouvrir PenguStream</a></p></noscript>
    </main>
</body>
</html>
